  <div id="painelSuporte" class="painel-suporte">

    <div class="suporte-box">

      <h2>SUPORTE</h2>

      <textarea id="mensagem"
      placeholder="Digite sua mensagem..."></textarea>

      <button onclick="enviarMensagem()">
        ENVIAR
      </button>

      <div id="listaMensagens"></div>

    </div>

  </div>

<script>

function abrirSuporte(){

const painel = document.getElementById('painelSuporte');

painel.style.display = 'flex';

}

function enviarMensagem(){

const mensagem = document.getElementById('mensagem').value;

if(mensagem === '') return;

const lista = document.getElementById('listaMensagens');

lista.innerHTML += `

<div class="mensagem-box">

<p><strong>Cliente:</strong> ${mensagem}</p>

<textarea placeholder="Responder cliente..."></textarea>

<button>RESPONDER</button>

</div>

`;

}

</script>
